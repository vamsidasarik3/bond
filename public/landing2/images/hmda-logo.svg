<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" width="100%" height="100%">
  <!-- Outer Glow & Shield Base -->
  <defs>
    <linearGradient id="hmdaBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142533"/>
      <stop offset="100%" stop-color="#0d1923"/>
    </linearGradient>
    <linearGradient id="hmdaGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2c884"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#9d7e2e"/>
    </linearGradient>
    <linearGradient id="hmdaGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ce058"/>
      <stop offset="100%" stop-color="#55992c"/>
    </linearGradient>
    <linearGradient id="hmdaBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="hmdaDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect x="2" y="2" width="416" height="116" rx="16" fill="url(#hmdaBgGrad)" stroke="rgba(201, 168, 76, 0.4)" stroke-width="1.5" filter="url(#hmdaDrop)"/>

  <!-- Circular Emblem Left -->
  <g transform="translate(18, 14)">
    <!-- Outer concentric ring -->
    <circle cx="46" cy="46" r="44" fill="#09141c" stroke="url(#hmdaGold)" stroke-width="2"/>
    <circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Green arch crescent (Growth / Ecology) -->
    <path d="M 22 56 A 26 26 0 0 1 70 56 A 21 21 0 0 0 22 56 Z" fill="url(#hmdaGreen)"/>
    
    <!-- Blue skyline arch (Urban Planning) -->
    <path d="M 28 44 A 20 20 0 0 1 64 44 A 16 16 0 0 0 28 44 Z" fill="url(#hmdaBlue)"/>

    <!-- Central Charminar / Historic Gateway Stylized Silhouette -->
    <path d="M 38 68 L 38 48 L 41 48 L 41 38 L 43 36 L 43 32 L 44 30 L 45 32 L 45 36 L 47 38 L 47 48 L 49 48 L 49 38 L 51 36 L 51 32 L 52 30 L 53 32 L 53 36 L 55 38 L 55 48 L 55 68 L 51 68 L 51 56 Q 46 51 42 56 L 42 68 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Foundation bar -->
    <rect x="33" y="68" width="27" height="3" rx="1" fill="url(#hmdaGold)"/>
  </g>

  <!-- Divider line -->
  <line x1="126" y1="20" x2="126" y2="100" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Typography Right -->
  <g transform="translate(142, 0)">
    <!-- HMDA Acronym -->
    <text x="0" y="48" font-family="'Copperplate', 'Cinzel', serif, sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="url(#hmdaGold)">
      HMDA
    </text>

    <!-- Authority Title -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#ffffff">
      HYDERABAD METROPOLITAN
    </text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="rgba(255,255,255,0.75)">
      DEVELOPMENT AUTHORITY
    </text>

    <!-- Verified Statutory Pill -->
    <g transform="translate(0, 93)">
      <rect x="0" y="0" width="168" height="16" rx="8" fill="rgba(113, 182, 68, 0.18)" stroke="rgba(113, 182, 68, 0.45)" stroke-width="0.8"/>
      <circle cx="8" cy="8" r="3" fill="#71b644"/>
      <text x="16" y="11.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.6" fill="#86efac">
        FINAL APPROVED LAYOUT
      </text>
    </g>
  </g>
</svg>
