<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .accent-line { stroke: rgba(113, 182, 68, 0.12); stroke-width: 1.5; }
    </style>
  </defs>
  <g fill="none">
    <!-- Angular interconnected geometric line network -->
    <polygon points="0,0 120,80 60,200 0,160" class="line" />
    <polygon points="120,80 260,30 220,170 60,200" class="line" />
    <polygon points="260,30 420,90 340,220 220,170" class="line" />
    <polygon points="420,90 560,40 480,180 340,220" class="line" />
    <polygon points="560,40 600,120 600,0" class="line" />
    <polygon points="480,180 600,120 600,280 440,320" class="line" />
    <polygon points="340,220 480,180 440,320 280,360" class="line" />
    <polygon points="220,170 340,220 280,360 140,310" class="line" />
    <polygon points="60,200 220,170 140,310 0,280" class="line" />
    <polygon points="0,280 140,310 80,400 0,400" class="line" />
    <polygon points="140,310 280,360 260,400 80,400" class="line" />
    <polygon points="280,360 440,320 460,400 260,400" class="line" />
    <polygon points="440,320 600,280 600,400 460,400" class="line" />

    <!-- Secondary diagonals for dynamic depth -->
    <line x1="120" y1="80" x2="340" y2="220" class="accent-line" />
    <line x1="260" y1="30" x2="480" y2="180" class="line" />
    <line x1="60" y1="200" x2="280" y2="360" class="line" />
    <line x1="220" y1="170" x2="440" y2="320" class="accent-line" />
    <line x1="340" y1="220" x2="600" y2="120" class="line" />
  </g>
</svg>
